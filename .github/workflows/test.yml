name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform:
          - "ubuntu-latest"
          - "ubuntu-24.04-arm"
          - "windows-latest"
          - "macos-latest" # arm
          - "macos-15-intel" # x86_64
        include:
          - platform: "ubuntu-latest"
            vcpkg_triplet: "x64-linux"
          - platform: "ubuntu-24.04-arm"
            vcpkg_triplet: "arm64-linux"
          - platform: "windows-latest"
            vcpkg_triplet: "x64-windows-static"
          - platform: "macos-latest"
            vcpkg_triplet: "arm64-osx"
          - platform: "macos-15-intel"
            vcpkg_triplet: "x64-osx"
    permissions:
      actions: write

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ matrix.platform }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ matrix.platform }}-

      - name: Install CMake 3.31
        if: matrix.platform != 'ubuntu-24.04-arm'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"

      - name: Install CMake 3.31 for ARM
        if: matrix.platform == 'ubuntu-24.04-arm'
        run: |
          wget https://github.com/Kitware/CMake/releases/download/v3.31.8/cmake-3.31.8-linux-aarch64.tar.gz
          tar -xzf cmake-3.31.8-linux-aarch64.tar.gz
          sudo mv cmake-3.31.8-linux-aarch64 /opt/cmake
          echo "/opt/cmake/bin" >> $GITHUB_PATH

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git -b 2025.03.19 --depth 1
          cd vcpkg && ./bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=${{github.workspace}}/vcpkg" >> $GITHUB_ENV
          echo "${{github.workspace}}/vcpkg" >> $GITHUB_PATH
          ./vcpkg integrate install
        shell: bash

      - name: Install OpenMP
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install libomp

      # windows-latest ships Visual Studio 18, which CMake 3.31 has no generator
      # for; it falls back to NMake and fails. Set up the MSVC environment and
      # use Ninja so the generator never depends on CMake knowing the VS version.
      - name: Set up MSVC environment
        if: startsWith(matrix.platform, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (Windows)
        if: startsWith(matrix.platform, 'windows')
        run: >
          cmake --preset=default -G Ninja
          -DVCPKG_TARGET_TRIPLET=${{matrix.vcpkg_triplet}}
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Configure CMake
        if: ${{ !startsWith(matrix.platform, 'windows') }}
        run: |
          cmake --preset=default -DVCPKG_TARGET_TRIPLET=${{matrix.vcpkg_triplet}}
          cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{env.BUILD_TYPE}} -L acquire-zarr --output-on-failure

  test_s3:
    name: Test S3
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_ARGS: "-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_URL: http://localhost:9000
      MINIO_ALIAS: myminio
      MINIO_BUCKET: acquire-test
      MINIO_ACCESS_KEY: acquire
      MINIO_SECRET_KEY: 12345678
      # dl.min.io now answers 410 Gone: MinIO archived the community server
      # and mc and stopped serving their binaries. The container images are
      # still published, so pull them from there instead.
      MINIO_IMAGE: minio/minio:RELEASE.2025-09-07T16-13-09Z
      MC_IMAGE: minio/mc:RELEASE.2025-08-13T08-35-41Z

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
          key: vcpkg-ubuntu-latest-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-ubuntu-latest-

      - name: Install CMake 3.31
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"

      - name: Start minio
        run: |
          # nothing here uses the web console, so neither its port nor
          # --console-address is worth carrying
          docker run -d --name minio -p 9000:9000 \
            -e "MINIO_ROOT_USER=$MINIO_ROOT_USER" \
            -e "MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD" \
            "$MINIO_IMAGE" server /data
          for _ in $(seq 60); do
            if curl -fsS "$MINIO_URL/minio/health/live" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            docker logs minio >&2
            echo "minio did not become ready" >&2
            exit 1
          fi

      - name: Create a service account and a bucket
        run: |
          # mc keeps its aliases in a config file, which a --rm container
          # throws away, so pass the target through MC_HOST_<alias> instead
          mc_host="http://$MINIO_ROOT_USER:$MINIO_ROOT_PASSWORD@${MINIO_URL#http://}"
          mcli() {
            docker run --rm --network host \
              -e "MC_HOST_$MINIO_ALIAS=$mc_host" \
              "$MC_IMAGE" "$@"
          }
          mcli admin user svcacct add \
            --access-key "$MINIO_ACCESS_KEY" \
            --secret-key "$MINIO_SECRET_KEY" \
            "$MINIO_ALIAS" "$MINIO_ROOT_USER"
          mcli mb "$MINIO_ALIAS/$MINIO_BUCKET"

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git -b 2025.03.19 --depth 1
          cd vcpkg && ./bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=${{github.workspace}}/vcpkg" >> $GITHUB_ENV
          echo "${{github.workspace}}/vcpkg" >> $GITHUB_PATH
          ./vcpkg integrate install
        shell: bash

      - name: Configure CMake
        run: |
          cmake --preset=default
          cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test C++
        working-directory: ${{github.workspace}}/build
        env:
          ZARR_S3_ENDPOINT: ${{ env.MINIO_URL }}
          ZARR_S3_BUCKET_NAME: ${{ env.MINIO_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ env.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.MINIO_SECRET_KEY }}
        run: ctest -C ${{env.BUILD_TYPE}} -L s3 --output-on-failure

      - name: Install dependencies
        run: python -m pip install -U pip "pybind11[global]" "cmake<4.0.0" build numpy pytest

      - name: Build and install Python bindings
        run: python -m pip install ".[testing]"

      - name: Test Python
        run: python -m pytest -v -k test_stream_data_to_s3


  test-python:
    name: Test Python on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - "ubuntu-latest"
          - "ubuntu-24.04-arm"
          - "windows-latest"
          - "macos-latest" # arm
          - "macos-15-intel" # x86_64

    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_ARGS: "-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.3"
          cache: 'pip'

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ matrix.platform }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ matrix.platform }}-

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git -b 2025.03.19 --depth 1
          cd vcpkg && ./bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=${{github.workspace}}/vcpkg" >> $GITHUB_ENV
          echo "${{github.workspace}}/vcpkg" >> $GITHUB_PATH
          ./vcpkg integrate install
        shell: bash

      - name: Install OpenMP
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install libomp

      # see the C/C++ job: VS18 has no CMake 3.31 generator. Set up MSVC and
      # tell scikit-build to drive the build with Ninja via CMAKE_GENERATOR.
      - name: Set up MSVC environment
        if: startsWith(matrix.platform, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Use Ninja generator on Windows
        if: startsWith(matrix.platform, 'windows')
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
        shell: bash

      - name: Install dependencies
        run: python -m pip install -U pip "pybind11[global]" "cmake<4.0.0" build numpy pytest

      - name: Build and install Python bindings
        run: python -m pip install ".[testing]"

      - name: Run tests
        run: python -m pytest -v